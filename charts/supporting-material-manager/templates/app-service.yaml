apiVersion: v1
kind: Service
metadata:
  name: {{ include "supporting-material-manager.appName" . }}
  labels:
    {{- include "supporting-material-manager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "supporting-material-manager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
